name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appointments
          POSTGRES_PASSWORD: appointments
          POSTGRES_DB: appointments
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @pkg/shared-types build
      - run: pnpm --filter @pkg/scheduling-core build
      - run: pnpm --filter @pkg/scheduling-core test:run

      - name: Migrate database
        env:
          DATABASE_URL: postgresql://appointments:appointments@localhost:5432/appointments
        run: |
          pnpm --filter @app/api exec prisma migrate deploy
          pnpm --filter @app/api prisma:seed

      - run: pnpm --filter @app/api build
      - run: pnpm --filter @app/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Concurrency test
        env:
          DATABASE_URL: postgresql://appointments:appointments@localhost:5432/appointments
        run: pnpm --filter @app/api test:concurrency
