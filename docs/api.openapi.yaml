openapi: 3.0.3
info:
  title: Appointment Booking API
  version: 1.0.0
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
  /catalog/locations:
    get:
      summary: List locations
      parameters:
        - name: org
          in: query
          schema: { type: string }
  /availability/slots:
    get:
      summary: Get available slots
      parameters:
        - { name: locationId, in: query, required: true, schema: { type: string } }
        - { name: serviceId, in: query, required: true, schema: { type: string } }
        - { name: providerId, in: query, required: true, schema: { type: string } }
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
  /appointments/book:
    post:
      summary: Book appointment (public)
  /appointments/manage/{token}:
    get:
      summary: Get appointment by manage token
  /appointments/admin:
    get:
      summary: List appointments (admin)
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
